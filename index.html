<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Polycats</title><link rel="stylesheet" href="style.css"></head><body><main><header><img class="logo" src="assets/ui/logo.svg" alt="Polycats"><button id="share" type="button" aria-label="分享猫猫图片" title="分享猫猫图片"><img src="assets/ui/share.svg" alt="" width="32" height="32"></button></header><div class="creation"><div class="deck"><div class="species" role="group" aria-label="选择角色"><button type="button" id="choose-cat" aria-label="猫猫" aria-pressed="true"><span class="cat-crop"><img src="assets/ui/tab-cat.png" alt=""></span></button><button type="button" id="choose-frog" aria-label="奶蛙" aria-pressed="false"><img src="assets/ui/tab-frog.svg" alt=""></button></div><section id="board" aria-label="多边形画板，空白处左右滑动换一只猫"><img id="photo-underlay" alt="导入图片叠底" hidden><div id="canvas" aria-label="拖动轮廓调整小猫，空白处左右滑动切换"></div><button id="download" type="button" aria-label="下载透明 PNG" title="下载透明 PNG"><img src="assets/ui/download.svg" alt="" width="24" height="24"></button><label id="photo-toggle" hidden><input id="show-photo" type="checkbox" checked>显示底图</label></section></div><p id="pose-status"></p></div><nav aria-label="画板操作"><button id="draw" aria-label="画多边形" title="画多边形"><img src="assets/ui/pencil.svg" alt="" width="32" height="32"></button><button id="random" aria-label="随机形状" title="随机形状"><img src="assets/ui/dice.svg" alt="" width="32" height="32"></button><button id="import-photo" aria-label="导入图片" title="导入图片"><img src="assets/ui/camera.svg" alt="" width="32" height="32"></button></nav><input id="photo-input" type="file" accept="image/*,.heic,.heif" hidden><div id="status" role="status" aria-live="polite" aria-atomic="true"></div></main><script type="module" src="app.js"></script></body></html>
