<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Polycats</title><link rel="stylesheet" href="style.css"></head><body><main><section id="board" aria-label="多边形画板"><img id="photo-underlay" alt="导入图片叠底" hidden><div id="canvas" aria-label="拖动轮廓，调整小猫"></div><p id="pose-status"></p></section><nav aria-label="画板操作"><button id="draw">画多边形</button><button id="random">随机形状</button><button id="reroll">换一只猫</button><button id="import-photo">导入图片</button></nav><input id="photo-input" type="file" accept="image/*,.heic,.heif" hidden><label id="photo-toggle" hidden><input id="show-photo" type="checkbox" checked>显示图片叠底</label><p id="import-status" role="status" hidden></p><div id="status" role="status" class="sr-only"></div></main><script type="module" src="app.js"></script></body></html>
