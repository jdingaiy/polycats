<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Polycats</title><link rel="stylesheet" href="style.css"></head><body><main><section id="board" aria-label="多边形画板"><img id="photo-underlay" alt="导入图片叠底" hidden><div id="canvas" aria-label="拖动轮廓，调整小猫"></div><p id="pose-status"></p><button id="share" type="button" aria-label="分享猫猫图片" title="分享猫猫图片"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m-4 4 4-4 4 4M6 11H4v10h16V11h-2"/></svg><span>分享</span></button><button id="download" type="button" aria-label="下载 PNG" title="下载 PNG"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v3h14v-3H5z"/></svg><span>下载</span></button></section><nav aria-label="画板操作"><button id="draw">画多边形</button><button id="random">随机形状</button><button id="reroll">换一只猫</button><button id="import-photo">导入图片</button></nav><input id="photo-input" type="file" accept="image/*,.heic,.heif" hidden><label id="photo-toggle" hidden><input id="show-photo" type="checkbox" checked>显示图片叠底</label><p id="import-status" role="status" hidden></p><div id="status" role="status"></div></main><script type="module" src="app.js"></script></body></html>
